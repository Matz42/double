<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tischtennis Doppel-Zählmaschine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT für Live-Synchronisation im selben Raum -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Technische, sehr gut lesbare Schriftarten (Chakra Petch & Share Tech Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #e8e6eb;
            --paper-pink-tint: #ecd8dc;
            --paper-line: rgba(255, 255, 255, 0.55);
            --pencil-dark: #2c2d30;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #2b2623;
            background-image: radial-gradient(#3d3530 1px, transparent 1px), radial-gradient(#322b27 1px, #241f1c 1px);
            background-size: 40px 40px;
            color: var(--pencil-dark);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .mono-num {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Notizpapier-Optik kombiniert mit technischer Klarheit */
        .notepad-paper {
            background-color: var(--paper-pink-tint);
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 35px,
                var(--paper-line) 36px,
                var(--paper-line) 38px
            );
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.55),
                0 2px 8px rgba(0, 0, 0, 0.25),
                inset 0 0 32px rgba(160, 120, 130, 0.22);
            position: relative;
        }

        /* Gezeichnete Rahmen-Boxen */
        .sketch-box {
            border: 2.5px solid var(--pencil-dark);
            border-radius: 4px;
            box-shadow: 
                2px 2px 0px rgba(44, 45, 48, 0.16),
                inset 1px 1px 0px rgba(255, 255, 255, 0.25);
            background-color: rgba(255, 255, 255, 0.18);
            transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .sketch-box-interactive:hover {
            background-color: rgba(255, 255, 255, 0.32);
        }

        .sketch-box-interactive:active {
            transform: scale(0.96);
            background-color: rgba(255, 255, 255, 0.45);
        }

        /* Editierbare Textfelder */
        .clean-input {
            background: transparent;
            color: var(--pencil-dark);
            outline: none;
            width: 100%;
            text-align: center;
        }
        .clean-input:focus {
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
        }

        /* Farbiger Tischtennisschläger Slot */
        .racket-slot {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .racket-active {
            opacity: 1;
            transform: scale(1.08) rotate(-8deg);
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
        }

        .racket-inactive {
            opacity: 0;
            transform: scale(0.2) rotate(25deg);
            pointer-events: none;
        }

        /* Animation bei Punkt-/Satz-/Matchgewinn */
        @keyframes scorePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.16); }
            100% { transform: scale(1); }
        }
        .score-animate {
            animation: scorePop 0.24s ease-out;
        }

        /* Gesperrt (Raum 0000 / leer): alles außer der Raumzeile ausgegraut */
        .locked > *:not(.room-row) {
            opacity: 0.4;
        }
        button:disabled {
            cursor: not-allowed;
        }
        input:disabled {
            cursor: not-allowed;
        }

        /* Gewinner-Hervorhebung */
        .winner-glow {
            border-color: #15803d !important;
            background-color: rgba(34, 197, 94, 0.25) !important;
            box-shadow: 0 0 15px rgba(22, 163, 74, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-5">

    <!-- Hauptblatt -->
    <main class="notepad-paper w-full max-w-md rounded-md px-4 py-5 sm:px-7 sm:py-6 flex flex-col justify-between">
        
        <!-- 1. ZEILE: Room mit "0000" vorbelegt + Live-Sync Statuspunkt -->
        <div class="room-row flex items-center justify-center gap-3 mb-4 relative">
            <label for="roomInput" class="text-2xl sm:text-3xl font-bold tracking-wider uppercase cursor-pointer">
                Room
            </label>
            <input 
                id="roomInput" 
                type="text" 
                value="0000" 
                placeholder="0000"
                aria-label="Raumnummer editieren"
                class="sketch-box clean-input mono-num w-32 sm:w-36 h-11 px-2 text-2xl sm:text-3xl font-bold tracking-widest"
            >
            <!-- Kleiner Verbindungs-Indikator für Mehrspieler-Sync -->
            <div id="syncDot" title="Kein MQTT (Raum 0000 / Lokal)" class="w-3 h-3 rounded-full bg-stone-400 absolute right-1 top-1/2 -translate-y-1/2 transition-colors"></div>
        </div>

        <!-- Schalter: nur dieses Gerät darf zählen / resetten / neu starten / Aufschlag wechseln -->
        <label class="flex items-center justify-center gap-2 mb-3 -mt-1 text-sm sm:text-base font-bold cursor-pointer select-none">
            <input id="soloCheck" type="checkbox" onchange="onSoloChange()" class="w-5 h-5 accent-stone-800 cursor-pointer">
            <span id="soloText">Nur ich zähle</span>
        </label>

        <!-- 2. ZEILE: Team 1 & Team 2 Überschriften (editierbar) -->
        <div class="grid grid-cols-11 items-center mb-1.5">
            <div class="col-span-4">
                <input 
                    id="team1Name" 
                    type="text" 
                    value="Team 1"
                    oninput="onNameChange()"
                    title="Klicken zum Umbenennen"
                    class="clean-input text-2xl sm:text-3xl font-bold tracking-tight border-b border-transparent hover:border-stone-500/40"
                >
            </div>
            <div class="col-span-3"></div>
            <div class="col-span-4">
                <input 
                    id="team2Name" 
                    type="text" 
                    value="Team 2"
                    oninput="onNameChange()"
                    title="Klicken zum Umbenennen"
                    class="clean-input text-2xl sm:text-3xl font-bold tracking-tight border-b border-transparent hover:border-stone-500/40"
                >
            </div>
        </div>

        <!-- 3. ZEILE (1. ZÄHLEBENE): Große Punkte-Boxen + P1/P2 untereinander + bunter Schläger + Undo-Pfeil -->
        <div class="grid grid-cols-11 items-start my-1">
            
            <!-- LINKE SPALTE: Team 1 Punkte + P1 & P2 untereinander -->
            <div class="col-span-4 flex flex-col items-center">
                <!-- Große Punkte-Box Team 1 -->
                <button 
                    id="scoreBox1"
                    onclick="addPoint(1)"
                    aria-label="Punkt für Team 1"
                    class="sketch-box sketch-box-interactive w-full aspect-square flex items-center justify-center cursor-pointer relative group mb-2.5"
                >
                    <span id="score1" class="mono-num text-6xl sm:text-7xl font-bold leading-none">0</span>
                    <span class="absolute bottom-1 right-1.5 text-xs font-bold opacity-0 group-hover:opacity-50 transition-opacity">+1</span>
                </button>

                <!-- Spieler P1 & P2 untereinander (mit Schläger rechts daneben wie auf der Skizze) -->
                <div class="w-full flex flex-col gap-1.5">
                    <!-- P1 von Team 1 -->
                    <div class="flex items-center w-full">
                        <input 
                            id="t1p1Name" 
                            type="text" 
                            value="P1" 
                            oninput="onNameChange()"
                            aria-label="Spieler 1 Team 1"
                            class="sketch-box clean-input h-9 text-lg sm:text-xl font-bold px-1.5"
                        >
                    </div>
                    <!-- P2 von Team 1 -->
                    <div class="flex items-center w-full">
                        <input 
                            id="t1p2Name" 
                            type="text" 
                            value="P2" 
                            oninput="onNameChange()"
                            aria-label="Spieler 2 Team 1"
                            class="sketch-box clean-input h-9 text-lg sm:text-xl font-bold px-1.5"
                        >
                    </div>
                </div>
            </div>

            <!-- MITTLERE SPALTE: Schläger-Anzeigen & Zurück-Button (Undo) -->
            <div class="col-span-3 flex flex-col items-center justify-between h-full pt-4">
                <!-- Oberer Platzhalter auf Höhe der großen Boxen -->
                <div class="flex-1 flex items-center justify-center">
                    <button 
                        id="undoBtn"
                        onclick="undoLastAction()"
                        disabled
                        title="Letzte Aktion rückgängig machen"
                        aria-label="Letzte Aktion rückgängig machen"
                        class="p-1.5 rounded-full transition-all duration-150 opacity-30 hover:opacity-100 active:scale-90 disabled:pointer-events-none"
                    >
                        <svg class="w-12 h-12 sm:w-14 sm:h-14 text-stone-800" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 28 60 C 58 64, 64 25, 26 24" />
                            <path d="M 35 14 L 22 24 L 34 34 Z" fill="currentColor" />
                        </svg>
                    </button>
                </div>

                <!-- Schläger-Spalte exakt auf Höhe der P1 / P2 Boxen -->
                <div class="w-full flex flex-col gap-1.5 mt-2.5">
                    <!-- Reihe für P1 (Links: Schläger T1-P1 | Rechts: Schläger T2-P1) -->
                    <div class="h-9 flex items-center justify-between px-1">
                        <div id="racket-0" class="racket-slot racket-active" title="Aufschlag: Team 1 - P1"></div>
                        <div id="racket-1" class="racket-slot racket-inactive" title="Aufschlag: Team 2 - P1"></div>
                    </div>
                    <!-- Reihe für P2 (Links: Schläger T1-P2 | Rechts: Schläger T2-P2) -->
                    <div class="h-9 flex items-center justify-between px-1">
                        <div id="racket-2" class="racket-slot racket-inactive" title="Aufschlag: Team 1 - P2"></div>
                        <div id="racket-3" class="racket-slot racket-inactive" title="Aufschlag: Team 2 - P2"></div>
                    </div>
                </div>
            </div>

            <!-- RECHTE SPALTE: Team 2 Punkte + P1 & P2 untereinander -->
            <div class="col-span-4 flex flex-col items-center">
                <!-- Große Punkte-Box Team 2 -->
                <button 
                    id="scoreBox2"
                    onclick="addPoint(2)"
                    aria-label="Punkt für Team 2"
                    class="sketch-box sketch-box-interactive w-full aspect-square flex items-center justify-center cursor-pointer relative group mb-2.5"
                >
                    <span id="score2" class="mono-num text-6xl sm:text-7xl font-bold leading-none">0</span>
                    <span class="absolute bottom-1 right-1.5 text-xs font-bold opacity-0 group-hover:opacity-50 transition-opacity">+1</span>
                </button>

                <!-- Spieler P1 & P2 untereinander -->
                <div class="w-full flex flex-col gap-1.5">
                    <!-- P1 von Team 2 -->
                    <div class="flex items-center w-full">
                        <input 
                            id="t2p1Name" 
                            type="text" 
                            value="P1" 
                            oninput="onNameChange()"
                            aria-label="Spieler 1 Team 2"
                            class="sketch-box clean-input h-9 text-lg sm:text-xl font-bold px-1.5"
                        >
                    </div>
                    <!-- P2 von Team 2 -->
                    <div class="flex items-center w-full">
                        <input 
                            id="t2p2Name" 
                            type="text" 
                            value="P2" 
                            oninput="onNameChange()"
                            aria-label="Spieler 2 Team 2"
                            class="sketch-box clean-input h-9 text-lg sm:text-xl font-bold px-1.5"
                        >
                    </div>
                </div>
            </div>

        </div>

        <!-- Status-Banner (Zeile 1: Aufschlag / Status | Zeile 2: Annahme nach Tischtennisregeln) -->
        <div class="min-h-[48px] flex flex-col items-center justify-center text-center bg-white/30 rounded px-2 py-1 mt-3 mb-2 border border-stone-500/20">
            <div id="statusBanner" class="text-sm sm:text-base font-bold text-stone-800 leading-snug">
                Aufschlag: Team 1 (P1)
            </div>
            <div id="receiverBanner" class="text-xs sm:text-sm font-bold text-stone-700 leading-snug">
                Annahme: Team 2 (P1)
            </div>
        </div>

        <!-- 2. ZÄHLEBENE: Sets Best of 3 -->
        <div class="mt-1 mb-2">
            <div class="text-center text-xl sm:text-2xl font-bold tracking-wide mb-1.5">
                Sets Best of 3
            </div>
            <div class="grid grid-cols-11 items-center">
                <div class="col-span-4 flex justify-center">
                    <button 
                        id="setBox1"
                        data-static="1"
                        tabindex="-1"
                        title="Sätze Team 1 (zählen automatisch)"
                        class="sketch-box w-full h-12 sm:h-14 flex items-center justify-center mono-num text-3xl sm:text-4xl font-bold cursor-default pointer-events-none"
                    >
                        <span id="sets1">0</span>
                    </button>
                </div>
                
                <div class="col-span-3 text-center text-2xl font-bold opacity-60 select-none">
                    :
                </div>
                
                <div class="col-span-4 flex justify-center">
                    <button 
                        id="setBox2"
                        data-static="1"
                        tabindex="-1"
                        title="Sätze Team 2 (zählen automatisch)"
                        class="sketch-box w-full h-12 sm:h-14 flex items-center justify-center mono-num text-3xl sm:text-4xl font-bold cursor-default pointer-events-none"
                    >
                        <span id="sets2">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. ZÄHLEBENE: Matches Best of 5 -->
        <div class="mt-1 mb-3">
            <div class="text-center text-xl sm:text-2xl font-bold tracking-wide mb-1.5">
                Matches Best of 5
            </div>
            <div class="grid grid-cols-11 items-center">
                <div class="col-span-4 flex justify-center">
                    <button 
                        id="matchBox1"
                        data-static="1"
                        tabindex="-1"
                        title="Matches Team 1 (zählen automatisch)"
                        class="sketch-box w-full h-12 sm:h-14 flex items-center justify-center mono-num text-3xl sm:text-4xl font-bold cursor-default pointer-events-none"
                    >
                        <span id="matches1">0</span>
                    </button>
                </div>
                
                <div class="col-span-3 text-center text-2xl font-bold opacity-60 select-none">
                    :
                </div>
                
                <div class="col-span-4 flex justify-center">
                    <button 
                        id="matchBox2"
                        data-static="1"
                        tabindex="-1"
                        title="Matches Team 2 (zählen automatisch)"
                        class="sketch-box w-full h-12 sm:h-14 flex items-center justify-center mono-num text-3xl sm:text-4xl font-bold cursor-default pointer-events-none"
                    >
                        <span id="matches2">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ERGEBNIS MELDEN BEREICH (erscheint sobald ein Sieger mit 3 Matches feststeht) -->
        <div id="reportSection" class="hidden flex-col items-center gap-1.5 my-2 p-2.5 rounded bg-emerald-950/10 border-2 border-emerald-700/40 transition-all">
            <div class="text-xs sm:text-sm font-bold text-stone-700">
                Vorschau Meldung: <span id="reportPreview" class="mono-num px-1.5 py-0.5 rounded bg-white/60 text-stone-900">!result 0000 3:0</span>
            </div>
            <button 
                id="reportBtn"
                onclick="reportResult()"
                class="w-full py-2.5 px-4 rounded font-bold text-base sm:text-lg text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer"
            >
                <span>📋 Ergebnis melden (Kopieren & Discord)</span>
            </button>
            <div id="copyFeedback" class="hidden text-xs font-bold text-emerald-800">
                ✔ In Zwischenablage kopiert! Öffne Discord...
            </div>
        </div>

        <!-- FUSSZEILE: Aufschlag wechseln | Neu starten (Reset) -->
        <div class="flex items-center justify-between pt-3 mt-1 border-t-2 border-stone-700/20 text-sm sm:text-base font-bold text-stone-800">
            <button 
                onclick="cycleStartServer()" 
                class="px-2.5 py-1.5 rounded bg-white/25 hover:bg-white/50 active:scale-95 transition-all border border-stone-600/30"
                title="Start-Aufschläger für diesen Satz weiterschalten"
            >
                Aufschlag wechseln
            </button>
            <button 
                onclick="resetAll()" 
                class="px-2.5 py-1.5 rounded bg-white/25 hover:bg-red-500/20 hover:text-red-900 active:scale-95 transition-all border border-stone-600/30"
            >
                Neu starten
            </button>
            <button 
                onclick="fullReset()" 
                class="px-2.5 py-1.5 rounded bg-red-600/15 text-red-900 hover:bg-red-600/30 active:scale-95 transition-all border border-red-800/40 tracking-wider"
                title="Alles auf Standard zurücksetzen (außer Raumname)"
            >
                RESET
            </button>
        </div>

    </main>

    <script>
        /**
         * Buntes Tischtennisschläger-SVG (Roter Belag, Holzgriff, weiß-oranger Ball)
         */
        const COLORFUL_RACKET_SVG = `
            <svg class="w-8 h-8" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Holzgriff -->
                <path d="M35 38 L45 57 L52 53 L41 35 Z" fill="#b45309" stroke="#2c2d30" stroke-width="3" stroke-linejoin="round"/>
                <!-- Schlägerblatt (Roter Gummi) -->
                <ellipse cx="27" cy="24" rx="16" ry="18" transform="rotate(-22 27 24)" fill="#e11d48" stroke="#2c2d30" stroke-width="3.2"/>
                <!-- Kantenband / Übergang -->
                <path d="M16 34 L38 25" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
                <!-- Tischtennisball -->
                <circle cx="50" cy="16" r="6" fill="#ffffff" stroke="#ea580c" stroke-width="2.8"/>
            </svg>
        `;

        // Schläger-SVGs in alle 4 Slots einsetzen
        for (let i = 0; i < 4; i++) {
            document.getElementById(`racket-${i}`).innerHTML = COLORFUL_RACKET_SVG;
        }

        /**
         * SPIELZUSTAND (3 Zählebenen + Namen)
         * Ebene 1: score1, score2 (Punkte bis 11, 2 Vorsprung)
         * Ebene 2: sets1, sets2 (Best of 3 -> wer 2 Sätze hat, gewinnt 1 Match)
         * Ebene 3: matches1, matches2 (Best of 5 -> wer 3 Matches hat, gewinnt das Gesamtdoppel)
         */
        let state = {
            score1: 0,
            score2: 0,
            sets1: 0,
            sets2: 0,
            matches1: 0,
            matches2: 0,
            serverOffset: 0, // Start-Aufschläger des Satzes: 0 = T1-P1, 1 = T2-P1, 2 = T1-P2, 3 = T2-P2
            serverDir: 1,    // Richtung der Aufschlagfolge: +1 (Satz 1, 3, ...) / -1 (Satz 2, 4, ...)
            controllerId: null, // Geräte-ID des alleinigen Zählers (null = jeder darf zählen)
            controllerSince: null, // Zeitpunkt, seit dem dieses Gerät Zähler ist (entscheidet bei Gleichzeitigkeit: wer zuerst war, behält ihn)
            team1Name: "Team 1",
            team2Name: "Team 2",
            t1p1Name: "P1",
            t1p2Name: "P2",
            t2p1Name: "P1",
            t2p2Name: "P2"
        };

        let historyStack = [];

        // Undo betrifft den Spielstand: Punkte, Sätze, Matches (inkl. Aufschlagfolge), aber nicht die Namen
        function saveHistory() {
            syncNamesFromInputs();
            historyStack.push({
                score1: state.score1,
                score2: state.score2,
                sets1: state.sets1,
                sets2: state.sets2,
                matches1: state.matches1,
                matches2: state.matches2,
                serverOffset: state.serverOffset,
                serverDir: state.serverDir
            });
            updateUndoButton();
        }

        // Verlauf leeren: nur beim Empfang eines Stands von einem anderen Gerät
        function clearHistory() {
            historyStack = [];
            updateUndoButton();
        }

        function syncNamesFromInputs() {
            state.team1Name = document.getElementById("team1Name").value || "Team 1";
            state.team2Name = document.getElementById("team2Name").value || "Team 2";
            state.t1p1Name = document.getElementById("t1p1Name").value || "P1";
            state.t1p2Name = document.getElementById("t1p2Name").value || "P2";
            state.t2p1Name = document.getElementById("t2p1Name").value || "P1";
            state.t2p2Name = document.getElementById("t2p2Name").value || "P2";
        }

        function onNameChange() {
            syncNamesFromInputs();
            render();
            broadcastState();
        }

        // Dynamische Bezeichnung des Spielers (Index 0..3)
        // 0: Team 1 (P1) | 1: Team 2 (P1) | 2: Team 1 (P2) | 3: Team 2 (P2)
        function getServerLabel(index) {
            const labels = [
                `${state.team1Name} (${state.t1p1Name})`,
                `${state.team2Name} (${state.t2p1Name})`,
                `${state.team1Name} (${state.t1p2Name})`,
                `${state.team2Name} (${state.t2p2Name})`
            ];
            return labels[index];
        }

        // Berechnet den aktuellen Aufschläger (0..3) nach Tischtennis-Doppelregeln
        function getCurrentServerIndex() {
            const totalPoints = state.score1 + state.score2;
            let serveChanges = 0;

            if (state.score1 >= 10 && state.score2 >= 10) {
                serveChanges = 10 + (totalPoints - 20);
            } else {
                serveChanges = Math.floor(totalPoints / 2);
            }

            const dir = state.serverDir === -1 ? -1 : 1;
            return (((state.serverOffset + dir * serveChanges) % 4) + 4) % 4;
        }

        // Berechnet den Rückschläger (Annahme) nach Tischtennis-Doppelregeln:
        // Im Doppel schlägt der aktuelle Aufschläger immer zu dem Spieler auf,
        // der als Nächstes in der 4er-Rotationskette selbst Aufschlag hat:
        // T1(P1) -> T2(P1) -> T1(P2) -> T2(P2) -> T1(P1)
        // Die Folge läuft pro Satz in eine Richtung (serverDir), im nächsten Satz umgekehrt.
        function getCurrentReceiverIndex() {
            const dir = state.serverDir === -1 ? -1 : 1;
            return (((getCurrentServerIndex() + dir) % 4) + 4) % 4;
        }

        // Prüft, ob ein Team im Best-of-5 bereits 3 Matches gewonnen hat
        function isMatchSeriesOver() {
            return state.matches1 >= 3 || state.matches2 >= 3;
        }

        // EBENE 1: Punkt hinzufügen
        function addPoint(team) {
            if (!isController()) return;
            // Wenn der Gesamtsieger feststeht, keine weiteren Klicks oder Auto-Resets zulassen
            if (isMatchSeriesOver()) {
                return;
            }

            saveHistory();

            if (team === 1) {
                state.score1++;
                animateElement("score1");
            } else {
                state.score2++;
                animateElement("score2");
            }

            let statusMsg = null;
            const s1 = state.score1;
            const s2 = state.score2;

            // Satzgewinn prüfen (mind. 11 Punkte & 2 Punkte Vorsprung)
            if ((s1 >= 11 || s2 >= 11) && Math.abs(s1 - s2) >= 2) {
                const winnerTeam = s1 > s2 ? 1 : 2;
                statusMsg = awardSetToTeam(winnerTeam, `${s1}:${s2}`);
            }

            render(statusMsg);
            broadcastState();
        }

        // EBENE 2 -> EBENE 3: Satz gutschreiben & Best-of-3 / Best-of-5 Logik prüfen
        function awardSetToTeam(winnerTeam, pointScoreStr = null) {
            const teamName = winnerTeam === 1 ? state.team1Name : state.team2Name;

            if (winnerTeam === 1) {
                state.sets1++;
                animateElement("sets1");
            } else {
                state.sets2++;
                animateElement("sets2");
            }

            // Punkte für nächsten Satz auf 0:0 setzen & Aufschlag-Zyklus weiterrücken
            state.score1 = 0;
            state.score2 = 0;

            // Doppelregel: Im nächsten Satz schlägt zuerst das Team auf, das im vorigen Satz
            // zuerst angenommen hat. Erster Rückschläger ist der Spieler, der zu ihm aufgeschlagen hat
            // -> die Reihenfolge läuft rückwärts (Richtung kehrt sich um).
            const oldDir = state.serverDir === -1 ? -1 : 1;
            state.serverOffset = (((state.serverOffset + oldDir) % 4) + 4) % 4;
            state.serverDir = -oldDir;

            const setScoreStr = `${state.sets1}:${state.sets2}`;

            // Best of 3 Sätze: Wer zuerst 2 Sätze erreicht (z.B. 2:0 oder 2:1), gewinnt das Match!
            if (state.sets1 >= 2 || state.sets2 >= 2) {
                if (winnerTeam === 1) {
                    state.matches1++;
                    animateElement("matches1");
                } else {
                    state.matches2++;
                    animateElement("matches2");
                }

                // Sätze nach Matchgewinn wieder auf 0:0 zurücksetzen
                state.sets1 = 0;
                state.sets2 = 0;

                // Prüfen, ob Best of 5 Matches gewonnen wurde (3 Siege, z.B. 3:1)
                if (state.matches1 >= 3 || state.matches2 >= 3) {
                    return `🏆 ${teamName} gewinnt die Serie (${state.matches1}:${state.matches2} Matches)!`;
                }

                return `Match an ${teamName} (${setScoreStr} Sätze)! Stand Matches: ${state.matches1}:${state.matches2}`;
            }

            return pointScoreStr 
                ? `Satz an ${teamName} (${pointScoreStr})! Sätze: ${setScoreStr}`
                : `Satz an ${teamName}! Sätze: ${setScoreStr}`;
        }

        // Manuelles Klicken auf die Satz-Boxen (Ebene 2)
        function addSetManual(team) {
            if (isMatchSeriesOver()) {
                return;
            }
            saveHistory();
            const msg = awardSetToTeam(team);
            render(msg);
            broadcastState();
        }

        // Manuelles Klicken auf die Match-Boxen (Ebene 3)
        function addMatchManual(team) {
            if (isMatchSeriesOver()) {
                return;
            }
            saveHistory();
            if (team === 1) {
                state.matches1++;
                animateElement("matches1");
            } else {
                state.matches2++;
                animateElement("matches2");
            }

            let msg = null;
            if (state.matches1 >= 3 || state.matches2 >= 3) {
                const winnerName = state.matches1 >= 3 ? state.team1Name : state.team2Name;
                msg = `🏆 ${winnerName} gewinnt die Serie (${state.matches1}:${state.matches2} Matches)!`;
            }

            render(msg);
            broadcastState();
        }

        // Letzte Aktion rückgängig machen (Undo)
        function undoLastAction() {
            if (!isController()) return;
            if (historyStack.length === 0) return;
            const prev = historyStack.pop();
            // Punkte, Sätze und Matches zurücksetzen (nie unter 0), bis ganz zurück auf 0:0 / 0:0 / 0:0
            state.score1 = Math.max(0, prev.score1);
            state.score2 = Math.max(0, prev.score2);
            state.sets1 = Math.max(0, prev.sets1);
            state.sets2 = Math.max(0, prev.sets2);
            state.matches1 = Math.max(0, prev.matches1);
            state.matches2 = Math.max(0, prev.matches2);
            state.serverOffset = prev.serverOffset;
            state.serverDir = prev.serverDir;
            updateUndoButton();
            render("Letzte Aktion rückgängig gemacht");
            broadcastState();
        }

        // Aufschlag manuell weiterschalten
        function cycleStartServer() {
            if (!isController()) return;
            saveHistory();
            state.serverOffset = (state.serverOffset + 1) % 4;
            render();
            broadcastState();
        }

        // RESET: alles auf Standard (Namen, Spielstand, Aufschlag, Undo-Verlauf), nur der Raumname bleibt
        function fullReset() {
            if (!isController()) return;
            state = {
                score1: 0,
                score2: 0,
                sets1: 0,
                sets2: 0,
                matches1: 0,
                matches2: 0,
                serverOffset: 0,
                serverDir: 1,
                controllerId: null,
                controllerSince: null,
                team1Name: "Team 1",
                team2Name: "Team 2",
                t1p1Name: "P1",
                t1p2Name: "P2",
                t2p1Name: "P1",
                t2p2Name: "P2"
            };
            historyStack = [];
            render("Alles auf Standard zurückgesetzt");
            broadcastState();
        }

        // Neu starten: Spielstand auf 0 (Punkte, Sätze, Matches), Namen bleiben, per Undo rückholbar
        function resetAll() {
            if (!isController()) return;
            saveHistory();
            state.score1 = 0;
            state.score2 = 0;
            state.sets1 = 0;
            state.sets2 = 0;
            state.matches1 = 0;
            state.matches2 = 0;
            state.serverOffset = 0;
            state.serverDir = 1;
            render("Zählmaschine zurückgesetzt");
            broadcastState();
        }

        function animateElement(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove("score-animate");
            void el.offsetWidth;
            el.classList.add("score-animate");
        }

        function updateUndoButton() {
            const btn = document.getElementById("undoBtn");
            if (historyStack.length > 0) {
                btn.disabled = false;
                btn.classList.remove("opacity-30");
                btn.classList.add("opacity-95");
            } else {
                btn.disabled = true;
                btn.classList.remove("opacity-95");
                btn.classList.add("opacity-30");
            }
        }

        // UI aktualisieren
        function render(customBannerText = null) {
            document.getElementById("score1").innerText = state.score1;
            document.getElementById("score2").innerText = state.score2;
            document.getElementById("sets1").innerText = state.sets1;
            document.getElementById("sets2").innerText = state.sets2;
            document.getElementById("matches1").innerText = state.matches1;
            document.getElementById("matches2").innerText = state.matches2;

            // Namen in Inputs synchron halten (falls über MQTT empfangen)
            if (document.activeElement !== document.getElementById("team1Name")) {
                document.getElementById("team1Name").value = state.team1Name;
            }
            if (document.activeElement !== document.getElementById("team2Name")) {
                document.getElementById("team2Name").value = state.team2Name;
            }
            if (document.activeElement !== document.getElementById("t1p1Name")) {
                document.getElementById("t1p1Name").value = state.t1p1Name;
            }
            if (document.activeElement !== document.getElementById("t1p2Name")) {
                document.getElementById("t1p2Name").value = state.t1p2Name;
            }
            if (document.activeElement !== document.getElementById("t2p1Name")) {
                document.getElementById("t2p1Name").value = state.t2p1Name;
            }
            if (document.activeElement !== document.getElementById("t2p2Name")) {
                document.getElementById("t2p2Name").value = state.t2p2Name;
            }

            // Gewinner-Hervorhebung bei 3 gewonnenen Matches (Best of 5)
            const mBox1 = document.getElementById("matchBox1");
            const mBox2 = document.getElementById("matchBox2");
            mBox1.classList.toggle("winner-glow", state.matches1 >= 3);
            mBox2.classList.toggle("winner-glow", state.matches2 >= 3);

            // "Ergebnis melden"-Button ein-/ausblenden, wenn der Gesamtsieger feststeht
            const reportSection = document.getElementById("reportSection");
            const reportPreview = document.getElementById("reportPreview");
            if (isMatchSeriesOver()) {
                reportSection.classList.remove("hidden");
                reportSection.classList.add("flex");
                reportPreview.innerText = generateResultString();
            } else {
                reportSection.classList.add("hidden");
                reportSection.classList.remove("flex");
                document.getElementById("copyFeedback").classList.add("hidden");
            }

            // Aktiven bunten Schläger einblenden
            const currentServer = getCurrentServerIndex();
            const currentReceiver = getCurrentReceiverIndex();
            for (let i = 0; i < 4; i++) {
                const racketEl = document.getElementById(`racket-${i}`);
                if (i === currentServer) {
                    racketEl.classList.remove("racket-inactive");
                    racketEl.classList.add("racket-active");
                } else {
                    racketEl.classList.remove("racket-active");
                    racketEl.classList.add("racket-inactive");
                }
            }

            // Banner-Text (Zeile 1: Aufschlag | Zeile 2: Annahme) aktualisieren
            const banner = document.getElementById("statusBanner");
            const receiverBanner = document.getElementById("receiverBanner");

            if (state.matches1 >= 3 || state.matches2 >= 3) {
                const winner = state.matches1 >= 3 ? state.team1Name : state.team2Name;
                banner.innerText = `🏆 ${winner} hat das Match (${state.matches1}:${state.matches2}) gewonnen!`;
                receiverBanner.classList.add("hidden");
            } else {
                receiverBanner.classList.remove("hidden");
                receiverBanner.innerText = `Annahme: ${getServerLabel(currentReceiver)}`;

                if (customBannerText) {
                    banner.innerText = customBannerText;
                } else {
                    const isDeuce = state.score1 >= 10 && state.score2 >= 10;
                    banner.innerText = isDeuce 
                        ? `Verlängerung! Aufschlag: ${getServerLabel(currentServer)}`
                        : `Aufschlag: ${getServerLabel(currentServer)}`;
                }
            }

            updateUndoButton();
            applyLock();
        }

        // Raum 0000 (oder leer) = gesperrt: nur das Raumfeld ist bedienbar
        function applyLock() {
            const locked = !isMqttActiveRoom();
            const main = document.querySelector("main");
            main.classList.toggle("locked", locked);

            const waiting = !locked && !roomSynced; // Raumstand noch nicht angekommen
            const otherCounts = !isController();     // ein anderes Gerät ist alleiniger Zähler
            const notCounter = otherCounts || waiting;
            document.getElementById("soloCheck").checked = state.controllerId === deviceId;
            document.getElementById("soloText").innerText = waiting
                ? "Verbinde mit Raum …"
                : (otherCounts ? "Ein anderes Gerät zählt (nur Namen änderbar)" : "Nur ich zähle");

            main.querySelectorAll("button, input").forEach(el => {
                if (el.id === "roomInput" || el.dataset.static) return;
                if (el.id === "soloCheck") { el.disabled = locked || notCounter; return; }
                if (el.type === "text") { el.disabled = locked || waiting; return; } // Namen erlaubt, sobald der Raumstand da ist
                if (el.id === "reportBtn") { el.disabled = locked; return; }
                if (el.id === "undoBtn") {
                    el.disabled = locked || notCounter || historyStack.length === 0;
                    return;
                }
                el.disabled = locked || notCounter;
            });

            if (locked) {
                document.getElementById("statusBanner").innerText = "🔒 Gesperrt – bitte Raumnummer eingeben (nicht 0000)";
                document.getElementById("receiverBanner").classList.add("hidden");
            }
        }

        // =====================================================================
        // ERGEBNIS MELDEN (Zwischenablage / Cutbuffer + Discord öffnen)
        // =====================================================================
        const DISCORD_CHANNEL_URL = "https://discord.com/channels/1515452247465525339/1562128494899495003";

        function generateResultString() {
            const roomNr = (document.getElementById("roomInput").value || "0000").trim();
            return `!result ${roomNr} ${state.matches1}:${state.matches2}`;
        }

        function copyTextToCutbuffer(text) {
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            tempInput.style.position = "fixed";
            tempInput.style.left = "-9999px";
            tempInput.style.top = "0";
            document.body.appendChild(tempInput);
            tempInput.focus();
            tempInput.select();

            try {
                document.execCommand("copy");
            } catch (err) {
                console.warn("Fallback copy fehlgeschlagen:", err);
            }
            document.body.removeChild(tempInput);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {});
            }
        }

        function reportResult() {
            const resultText = generateResultString();

            // 1. Aktion: Text in den Cutbuffer (Zwischenablage) schieben
            copyTextToCutbuffer(resultText);

            // Visuelles Feedback anzeigen
            const feedback = document.getElementById("copyFeedback");
            feedback.innerText = `✔ "${resultText}" kopiert! Öffne Discord...`;
            feedback.classList.remove("hidden");

            // 2. Aktion: Discord-Kanal öffnen
            const newWin = window.open(DISCORD_CHANNEL_URL, "_blank");
            if (!newWin) {
                window.location.href = DISCORD_CHANNEL_URL;
            }
        }

        // =====================================================================
        // LIVE-SYNCHRONISATION (MQTT über WebSockets - AUS bei "0000" oder leer)
        // =====================================================================
        let mqttClient = null;
        let currentTopic = "";
        let roomSynced = false;       // true, sobald der gespeicherte Raumstand angekommen ist (oder der Raum leer ist)
        let syncTimer = null;
        let syncFallbackTimer = null;
        const clientId = "tt_client_" + Math.random().toString(16).slice(2, 10);

        // Feste Geräte-ID (bleibt nach Neuladen erhalten), damit der Zähler sich nicht selbst aussperrt
        const deviceId = (function () {
            const fresh = "dev_" + Math.random().toString(16).slice(2, 12);
            try {
                let id = localStorage.getItem("tt_device_id");
                if (!id) {
                    id = fresh;
                    localStorage.setItem("tt_device_id", id);
                }
                return id;
            } catch (e) {
                return fresh;
            }
        })();

        // Gespeicherte Raumstände (retained) älter als dies werden beim Betreten ignoriert -> Raum startet leer
        const MAX_STATE_AGE_MS = 12 * 60 * 60 * 1000; // 12 Stunden

        const NAME_KEYS = ["team1Name", "team2Name", "t1p1Name", "t1p2Name", "t2p1Name", "t2p2Name"];

        // true, wenn dieses Gerät zählen darf (kein Zähler festgelegt oder dieses Gerät ist es)
        function isController() {
            return !state.controllerId || state.controllerId === deviceId;
        }

        // Haken "Nur ich zähle"
        function onSoloChange() {
            const cb = document.getElementById("soloCheck");
            if (cb.checked) {
                // Nur einer darf Zähler sein: solange der Raumstand fehlt oder jemand anderes zählt, kein Haken
                if (!roomSynced || (state.controllerId && state.controllerId !== deviceId)) {
                    render();
                    return;
                }
                state.controllerId = deviceId;
                state.controllerSince = Date.now();
            } else if (state.controllerId === deviceId) {
                state.controllerId = null;
                state.controllerSince = null;
            }
            render();
            broadcastState();
        }

        function isMqttActiveRoom() {
            const roomVal = document.getElementById("roomInput").value.trim();
            return roomVal !== "" && roomVal !== "0000";
        }

        function setupRoomSync() {
            const roomVal = document.getElementById("roomInput").value.trim();
            const dot = document.getElementById("syncDot");

            // Bestehende Verbindung sauber trennen
            if (mqttClient) {
                try { mqttClient.end(true); } catch (e) {}
                mqttClient = null;
            }

            // Neuer Raum: Zähler-Status zurücksetzen und auf den gespeicherten Raumstand warten
            state.controllerId = null;
            state.controllerSince = null;
            clearHistory();
            roomSynced = false;
            clearTimeout(syncTimer);
            clearTimeout(syncFallbackTimer);
            render();

            // Wenn Raum "0000" oder leer ist -> KEINE Kommunikation über MQTT
            if (!isMqttActiveRoom()) {
                currentTopic = "";
                dot.className = "w-3 h-3 rounded-full bg-stone-400 absolute right-1 top-1/2 -translate-y-1/2 transition-colors";
                dot.title = "Kein MQTT (Raum 0000 / Lokal)";
                return;
            }

            currentTopic = "tt_doppel_sync_v2_" + encodeURIComponent(roomVal);
            dot.className = "w-3 h-3 rounded-full bg-amber-500 absolute right-1 top-1/2 -translate-y-1/2 transition-colors";
            dot.title = "Verbinde mit Raum " + roomVal + "...";

            // Notausgang: auch ohne Verbindung/Raumstand nach 6 s freigeben (z. B. offline)
            syncFallbackTimer = setTimeout(() => {
                if (!roomSynced) { roomSynced = true; render(); }
            }, 6000);

            try {
                mqttClient = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5000,
                    reconnectPeriod: 3000
                });

                mqttClient.on("connect", () => {
                    dot.className = "w-3 h-3 rounded-full bg-emerald-600 shadow-[0_0_8px_#059669] absolute right-1 top-1/2 -translate-y-1/2 transition-colors";
                    dot.title = "Live verbunden (Raum: " + roomVal + ")";
                    mqttClient.subscribe(currentTopic);

                    // Kurz auf den gespeicherten Raumstand warten; kommt keiner, ist der Raum frei
                    clearTimeout(syncTimer);
                    syncTimer = setTimeout(() => {
                        if (!roomSynced) { roomSynced = true; render(); }
                    }, 1500);
                });

                mqttClient.on("close", () => {
                    dot.className = "w-3 h-3 rounded-full bg-stone-400 absolute right-1 top-1/2 -translate-y-1/2 transition-colors";
                    dot.title = "Offline";
                });

                mqttClient.on("message", (topic, message, packet) => {
                    if (!isMqttActiveRoom()) return;
                    try {
                        const payload = JSON.parse(message.toString());
                        if (payload.senderId === clientId) return; // Eigene Nachrichten ignorieren

                        // Gespeicherter Raumstand beim Betreten: zu alt oder ohne Zeitstempel -> ignorieren
                        const isRetained = !!(packet && packet.retain);
                        if (isRetained && !(Date.now() - Number(payload.ts) <= MAX_STATE_AGE_MS)) {
                            roomSynced = true; // Raum gilt als leer, nichts übernehmen
                            render();
                            return;
                        }
                        if (payload.state) {
                            roomSynced = true; // Raumstand ist angekommen
                            const incoming = payload.state;
                            const remoteClaims = incoming.controllerId && payload.deviceId === incoming.controllerId;

                            let acceptFull;
                            if (!state.controllerId || payload.deviceId === state.controllerId) {
                                // Kein Zähler festgelegt, oder der Zähler selbst sendet
                                acceptFull = true;
                            } else if (remoteClaims && incoming.controllerId !== state.controllerId) {
                                // Zwei Geräte beanspruchen den Zähler: wer zuerst war, behält ihn
                                const mine = Number(state.controllerSince) || 0;
                                const theirs = Number(incoming.controllerSince) || 0;
                                acceptFull = theirs < mine ||
                                    (theirs === mine && String(incoming.controllerId) < String(state.controllerId));
                            } else {
                                acceptFull = false;
                            }

                            if (acceptFull) {
                                state = incoming;
                                clearHistory();
                                render();
                            } else {
                                // Absender ist nicht der Zähler: nur Namen übernehmen
                                NAME_KEYS.forEach(k => {
                                    if (typeof incoming[k] === "string") {
                                        state[k] = incoming[k].slice(0, 40);
                                    }
                                });
                                render();
                                // Der Zähler stellt den maßgeblichen Gesamtstand wieder her
                                if (state.controllerId === deviceId) broadcastState();
                            }
                        }
                    } catch (err) {}
                });
            } catch (err) {
                console.warn("MQTT Sync nicht verfügbar:", err);
            }
        }

        function broadcastState() {
            // Sende nur, wenn Raum weder leer noch "0000" ist
            if (!isMqttActiveRoom()) return;

            if (mqttClient && mqttClient.connected && currentTopic) {
                const payload = JSON.stringify({
                    senderId: clientId,
                    deviceId: deviceId,
                    ts: Date.now(),
                    state: state
                });
                mqttClient.publish(currentTopic, payload, { retain: true });
            }
        }

        document.getElementById("roomInput").addEventListener("input", () => {
            render(); // Sperre sofort aktualisieren
            if (isMatchSeriesOver()) {
                document.getElementById("reportPreview").innerText = generateResultString();
            }
            // Sofort trennen, falls der Benutzer auf "0000" oder leer zurückstellt
            if (!isMqttActiveRoom() && mqttClient) {
                setupRoomSync();
            }
        });
        document.getElementById("roomInput").addEventListener("change", setupRoomSync);

        window.onload = function() {
            render();
            setupRoomSync();
        };
    </script>
</body>
</html>
